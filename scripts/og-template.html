<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>OG Image</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,300..700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=block"
			rel="stylesheet"
		/>
		<style>
			/* Night tokens from src/app.css */
			:root {
				--canvas: #070a0f;
				--surface: #0d1219;
				--ink: #e9edf2;
				--ink-2: #a1abb6;
				--ink-3: #6f7a86;
				--line: #19212b;
				--line-2: #2c3846;
				--livery-1: #ef6440;
				--livery-2: #f59b3a;
				--livery-3: #f5c94d;
				--livery-4: #36b3a3;
				--on-livery: #15100b;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				background: var(--canvas);
			}

			.card {
				position: relative;
				width: 1536px;
				height: 1024px;
				overflow: hidden;
				background: var(--canvas);
				color: var(--ink);
				font-family: 'IBM Plex Sans', sans-serif;
				display: grid;
				grid-template-rows: auto 1fr auto;
				padding: 72px 88px 0;
			}

			#stars {
				position: absolute;
				inset: 0;
			}

			.hud {
				--k: 22px;
				--c: var(--line-2);
				background:
					linear-gradient(var(--c), var(--c)) left top / var(--k) 2px no-repeat,
					linear-gradient(var(--c), var(--c)) left top / 2px var(--k) no-repeat,
					linear-gradient(var(--c), var(--c)) right top / var(--k) 2px no-repeat,
					linear-gradient(var(--c), var(--c)) right top / 2px var(--k) no-repeat,
					linear-gradient(var(--c), var(--c)) left bottom / var(--k) 2px no-repeat,
					linear-gradient(var(--c), var(--c)) left bottom / 2px var(--k) no-repeat,
					linear-gradient(var(--c), var(--c)) right bottom / var(--k) 2px no-repeat,
					linear-gradient(var(--c), var(--c)) right bottom / 2px var(--k) no-repeat;
			}

			.eyebrow {
				font:
					500 22px/1.3 'IBM Plex Mono',
					monospace;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--ink-3);
			}

			.top {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding-bottom: 28px;
				border-bottom: 2px solid var(--line);
			}

			.logo {
				font:
					600 34px 'Saira',
					sans-serif;
				font-stretch: 112%;
				letter-spacing: 0.02em;
			}

			.logo i {
				display: inline-block;
				width: 0.5em;
				height: 1em;
				margin-left: 5px;
				vertical-align: -4px;
				background: var(--livery-1);
			}

			.main {
				position: relative;
				display: grid;
				grid-template-columns: 1fr 520px;
				gap: 64px;
				align-items: center;
				min-height: 0;
			}

			.main.no-image {
				grid-template-columns: 1fr;
			}

			.main.no-image .frame {
				display: none;
			}

			h1 {
				margin: 0;
				font-family: 'Saira', sans-serif;
				font-weight: 600;
				font-stretch: 108%;
				letter-spacing: -0.015em;
				line-height: 1.06;
				font-size: 84px;
				text-wrap: balance;
				display: -webkit-box;
				-webkit-line-clamp: 5;
				-webkit-box-orient: vertical;
				overflow: hidden;
			}

			.preview {
				margin: 36px 0 0;
				max-width: 30em;
				font-size: 30px;
				line-height: 1.45;
				color: var(--ink-2);
				display: -webkit-box;
				-webkit-line-clamp: 3;
				-webkit-box-orient: vertical;
				overflow: hidden;
			}

			.tags {
				display: flex;
				gap: 14px;
				flex-wrap: wrap;
				margin-top: 40px;
			}

			.tag {
				font:
					500 24px 'IBM Plex Mono',
					monospace;
				padding: 4px 18px 4px 26px;
				color: var(--on-livery);
				clip-path: polygon(11px 0, 100% 0, 100% 100%, 0 100%);
			}

			.frame {
				padding: 16px;
			}

			.frame img {
				display: block;
				width: 100%;
				aspect-ratio: 3 / 2;
				object-fit: cover;
				box-shadow: 0 28px 60px -30px rgb(0 0 0 / 0.9);
			}

			.frame figcaption {
				margin-top: 10px;
				text-align: right;
				font-size: 18px;
			}

			.bottom {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin: 0 -88px;
				padding: 26px 88px 30px;
			}

			.livery {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 14px;
				display: grid;
				grid-template-columns: repeat(4, 1fr);
			}

			.livery i:nth-child(1) {
				background: var(--livery-1);
			}
			.livery i:nth-child(2) {
				background: var(--livery-2);
			}
			.livery i:nth-child(3) {
				background: var(--livery-3);
			}
			.livery i:nth-child(4) {
				background: var(--livery-4);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<svg id="stars" aria-hidden="true"></svg>

			<div class="top">
				<span class="logo">maltsev.space<i></i></span>
				<span class="eyebrow" id="meta">Notes / 000 · 2025-01-01</span>
			</div>

			<div class="main" id="main">
				<div>
					<h1 id="title">Title</h1>
					<p class="preview" id="preview">Preview</p>
					<div class="tags" id="tags"></div>
				</div>
				<figure class="frame hud" style="margin: 0">
					<img id="hero-image" alt="" />
					<figcaption class="eyebrow" id="caption" hidden></figcaption>
				</figure>
			</div>

			<div class="bottom">
				<span class="eyebrow" id="author">Aleksey Maltsev</span>
				<span class="eyebrow" id="reading">maltsev.space/blog</span>
				<div class="livery"><i></i><i></i><i></i><i></i></div>
			</div>
		</div>

		<script>
			// Same seeded star field as the site's Night mode
			(function drawStars() {
				const svg = document.getElementById('stars');
				const w = 1536;
				const h = 1024;
				svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
				let seed = 7;
				const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
				let out = '';
				for (let k = 0; k < 110; k++) {
					const x = (r() * w).toFixed(1);
					const y = (r() * h).toFixed(1);
					const rad = r() > 0.94 ? 1.8 : 0.9;
					const o = (0.2 + r() * 0.6).toFixed(2);
					out += `<circle cx="${x}" cy="${y}" r="${rad}" fill="#dfe6ee" opacity="${o}"/>`;
				}
				svg.innerHTML = out;
			})();

			// Called by generate-og-images.js; tag colours arrive as CSS variable names
			function setContent({
				title,
				preview,
				date,
				number,
				author,
				tags,
				caption,
				heroImageBase64
			}) {
				const titleEl = document.getElementById('title');
				titleEl.textContent = title;
				titleEl.style.fontSize = title.length > 70 ? '64px' : title.length > 48 ? '74px' : '84px';
				document.getElementById('preview').textContent = preview;
				document.getElementById('meta').textContent = `Notes / ${number} · ${date}`;
				const captionEl = document.getElementById('caption');
				captionEl.textContent = caption || '';
				captionEl.hidden = !caption;
				document.getElementById('author').textContent = author;

				const tagsEl = document.getElementById('tags');
				tagsEl.innerHTML = '';
				for (const tag of tags) {
					const span = document.createElement('span');
					span.className = 'tag';
					span.style.background = `var(${tag.color})`;
					span.textContent = tag.label;
					tagsEl.appendChild(span);
				}

				const img = document.getElementById('hero-image');
				if (heroImageBase64) {
					img.src = heroImageBase64;
				} else {
					document.getElementById('main').classList.add('no-image');
				}
			}

			window.ogReady = true;
		</script>
	</body>
</html>
